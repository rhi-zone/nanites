[package]
name = "nanites-chat"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Chat orchestration layer built on the nanites substrate"

[dependencies]
nanites-core = { path = "../nanites-core" }
nanites-rig = { path = "../nanites-rig", features = ["rag"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
rig-core = "0.33"
