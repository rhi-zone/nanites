[package]
name = "nanites-core"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Core primitives for turn-based orchestration"

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rig-core = "0.33"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
